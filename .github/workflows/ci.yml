# Unit tests + lint on every PR and every push to main. No Redis, no Docker (the e2e fixture
# local-test/run.sh stays local). Contract enforced by tests/test_ci_workflow.py.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }   # requires-python floor
          - { os: ubuntu-latest, python: "3.14" }   # latest stable
          - { os: macos-latest, python: "3.14" }    # Homebrew bash 5 + stock /bin/bash 3.2
    env:
      CI_FORBID_SKIPS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: bash 5 via Homebrew (project prerequisite on macOS)
        if: runner.os == 'macOS'
        run: brew install bash
      - name: Shell versions
        run: |
          command -v bash
          bash --version | head -1
          /bin/bash --version | head -1
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -rs

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: ruff
        run: ruff check --output-format=github .
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 shellcheck
